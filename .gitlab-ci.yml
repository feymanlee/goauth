workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - test

default:
  interruptible: true

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOTOOLCHAIN: "local"
  CGO_ENABLED: "1"

test:
  stage: test
  image: "golang:${GO_VERSION}"
  parallel:
    matrix:
      - GO_VERSION: ["1.22", "1.25", "1.26"]
  cache:
    key: "go-${GO_VERSION}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/go/
      - .cache/go-build/
  script:
    - go version
    - go test ./...
    - |
      if [ "$GO_VERSION" = "1.26" ]; then
        go test -race ./...
      fi
